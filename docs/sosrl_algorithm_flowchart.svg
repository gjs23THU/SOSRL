<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #203040; }
      .zone-title { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 1px; fill: #24323d; }
      .label { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #26343e; }
      .body { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #26343e; }
      .small { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #34434f; }
      .tiny { font: 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #46535d; }
      .flow { fill: none; stroke: #3478a6; stroke-width: 3; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #769b36; stroke-width: 3; marker-end: url(#arrow-green); }
      .flow-orange { fill: none; stroke: #bd6b2c; stroke-width: 3; marker-end: url(#arrow-orange); }
      .train-flow { fill: none; stroke: #76589a; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .zone { stroke: #4c5257; stroke-width: 2.4; }
      .node { stroke: #46525a; stroke-width: 1.8; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3478a6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#769b36"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#bd6b2c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#76589a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#26343e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="#f7f5ef"/>
  <text x="800" y="38" text-anchor="middle" class="title">SOSRL 分层规则选择 DQN 调度算法流程</text>

  <!-- Start and input -->
  <ellipse cx="800" cy="77" rx="62" ry="24" fill="#f2cfae" class="node" filter="url(#shadow)"/>
  <text x="800" y="83" text-anchor="middle" class="label">开始</text>
  <path d="M800 101 L800 126" class="flow"/>
  <polygon points="625,126 1000,126 975,190 600,190" fill="#f8dfc8" class="node" filter="url(#shadow)"/>
  <text x="800" y="151" text-anchor="middle" class="label">读取 config.json，设置随机种子与训练参数</text>
  <text x="800" y="176" text-anchor="middle" class="small">任务生成参数 · 架构约束 · DQN 超参数 · 训练/评估轮次</text>

  <!-- Scenario pool -->
  <g filter="url(#shadow)">
    <path d="M38 220 C38 202 360 202 360 220 L360 342 C360 360 38 360 38 342 Z" fill="#d7e7f2" class="node"/>
    <ellipse cx="199" cy="220" rx="161" ry="18" fill="#c8ddeb" class="node"/>
    <path d="M38 342 C38 324 360 324 360 342" fill="none" stroke="#46525a" stroke-width="1.8"/>
  </g>
  <text x="199" y="250" text-anchor="middle" class="label">训练 / 评估场景池</text>
  <text x="199" y="277" text-anchor="middle" class="body">随机任务：30 个任务 × 4 道工序</text>
  <text x="199" y="302" text-anchor="middle" class="body">随机架构：成本、覆盖时长、容量约束</text>
  <text x="199" y="327" text-anchor="middle" class="small">可选：共享同一 mission</text>
  <path d="M645 190 C555 208 470 224 360 252" class="flow"/>

  <!-- DQN controller zone -->
  <rect x="395" y="215" width="700" height="335" rx="42" fill="#edf2e7" class="zone"/>
  <text x="745" y="245" text-anchor="middle" class="zone-title">DQN 规则控制器</text>

  <rect x="430" y="270" width="275" height="102" rx="10" fill="#d8e8f3" class="node" filter="url(#shadow)"/>
  <text x="568" y="297" text-anchor="middle" class="label">初始化 / 重置 MissionEnv</text>
  <text x="568" y="323" text-anchor="middle" class="body">固定 architecture + mission</text>
  <text x="568" y="348" text-anchor="middle" class="body">生成 25 维聚合状态 sₜ</text>
  <path d="M360 282 L430 314" class="flow"/>

  <rect x="745" y="270" width="315" height="102" rx="10" fill="#bfd6e8" class="node" filter="url(#shadow)"/>
  <text x="903" y="297" text-anchor="middle" class="label">在线 Q 网络</text>
  <text x="903" y="323" text-anchor="middle" class="body">MLP：25 → H → H → 4</text>
  <text x="903" y="348" text-anchor="middle" class="body">ε-greedy 选择规则动作 aₜ</text>
  <path d="M705 321 L745 321" class="flow"/>
  <text x="725" y="310" text-anchor="middle" class="tiny">sₜ</text>

  <rect x="430" y="405" width="630" height="110" rx="12" fill="#e2ebd4" class="node"/>
  <text x="745" y="430" text-anchor="middle" class="label">动作空间：4 条工序选择规则</text>
  <rect x="452" y="448" width="135" height="46" rx="18" fill="#fffaf2" class="node"/>
  <rect x="602" y="448" width="135" height="46" rx="18" fill="#fffaf2" class="node"/>
  <rect x="752" y="448" width="135" height="46" rx="18" fill="#fffaf2" class="node"/>
  <rect x="902" y="448" width="135" height="46" rx="18" fill="#fffaf2" class="node"/>
  <text x="520" y="467" text-anchor="middle" class="label">SPT</text>
  <text x="520" y="486" text-anchor="middle" class="tiny">min duration</text>
  <text x="670" y="467" text-anchor="middle" class="label">WINQ</text>
  <text x="670" y="486" text-anchor="middle" class="tiny">min next-type load</text>
  <text x="820" y="467" text-anchor="middle" class="label">CR</text>
  <text x="820" y="486" text-anchor="middle" class="tiny">min TTD / remaining</text>
  <text x="970" y="467" text-anchor="middle" class="label">MS</text>
  <text x="970" y="486" text-anchor="middle" class="tiny">min slack</text>
  <path d="M903 372 L903 405" class="flow"/>

  <!-- Rule layer -->
  <rect x="1145" y="215" width="415" height="410" rx="38" fill="#e8f0f6" class="zone"/>
  <text x="1353" y="245" text-anchor="middle" class="zone-title">规则层与系统分配</text>

  <rect x="1182" y="275" width="340" height="78" rx="10" fill="#d8e8f3" class="node" filter="url(#shadow)"/>
  <text x="1352" y="301" text-anchor="middle" class="label">构造全局可行工序集合</text>
  <text x="1352" y="328" text-anchor="middle" class="body">前置完成 + 类型匹配 + 时间窗可行</text>
  <path d="M1060 460 C1122 452 1135 353 1182 321" class="flow"/>
  <text x="1119" y="419" text-anchor="middle" class="tiny">选定规则</text>

  <rect x="1182" y="382" width="340" height="82" rx="10" fill="#c8deed" class="node" filter="url(#shadow)"/>
  <text x="1352" y="408" text-anchor="middle" class="label">规则排序并选择工序</text>
  <text x="1352" y="435" text-anchor="middle" class="small">(规则指标, 最早开始, task_idx, op_idx)</text>
  <path d="M1352 353 L1352 382" class="flow"/>

  <rect x="1182" y="493" width="340" height="82" rx="10" fill="#c7d9b0" class="node" filter="url(#shadow)"/>
  <text x="1352" y="519" text-anchor="middle" class="label">CSSA 选择执行系统</text>
  <text x="1352" y="546" text-anchor="middle" class="small">(start, finish, busy, sys_idx) 最小</text>
  <path d="M1352 464 L1352 493" class="flow-green"/>

  <rect x="1218" y="591" width="268" height="62" rx="8" fill="#f7e7cf" class="node" filter="url(#shadow)"/>
  <text x="1352" y="616" text-anchor="middle" class="label">编码 assignment 动作</text>
  <text x="1352" y="640" text-anchor="middle" class="small">(task, operation, system)</text>
  <path d="M1352 575 L1352 591" class="flow-orange"/>

  <!-- Training update zone -->
  <rect x="38" y="430" width="315" height="483" rx="38" fill="#eee8f4" class="zone"/>
  <text x="196" y="461" text-anchor="middle" class="zone-title">训练更新（仅训练阶段）</text>

  <g filter="url(#shadow)">
    <path d="M72 500 C72 485 319 485 319 500 L319 591 C319 606 72 606 72 591 Z" fill="#d9cae8" class="node"/>
    <ellipse cx="196" cy="500" rx="123" ry="15" fill="#cfbce1" class="node"/>
    <path d="M72 591 C72 576 319 576 319 591" fill="none" stroke="#46525a" stroke-width="1.8"/>
  </g>
  <text x="196" y="528" text-anchor="middle" class="label">经验回放 Replay Buffer</text>
  <text x="196" y="554" text-anchor="middle" class="small">(sₜ, aₜ, rₜ, sₜ₊₁, done, mask)</text>
  <text x="196" y="580" text-anchor="middle" class="small">达到最小容量后随机采样 batch</text>

  <rect x="72" y="638" width="247" height="112" rx="10" fill="#ddd1e9" class="node" filter="url(#shadow)"/>
  <text x="196" y="665" text-anchor="middle" class="label">更新在线 Q 网络</text>
  <text x="196" y="692" text-anchor="middle" class="small">y = r + γ(1-done) max Q_target</text>
  <text x="196" y="717" text-anchor="middle" class="small">MSE loss + 梯度裁剪 + Adam</text>
  <text x="196" y="739" text-anchor="middle" class="tiny">每隔 K 步同步目标网络</text>
  <path d="M196 606 L196 638" class="train-flow"/>

  <rect x="72" y="790" width="247" height="78" rx="10" fill="#e9d8c9" class="node" filter="url(#shadow)"/>
  <text x="196" y="817" text-anchor="middle" class="label">每轮结束</text>
  <text x="196" y="844" text-anchor="middle" class="small">ε 衰减 + 记录 reward / makespan</text>
  <path d="M196 750 L196 790" class="train-flow"/>
  <path d="M319 693 C373 693 367 321 745 321" class="train-flow"/>
  <text x="381" y="671" class="tiny">更新权重</text>

  <!-- Environment zone -->
  <rect x="395" y="590" width="760" height="390" rx="42" fill="#e9e7f0" class="zone"/>
  <text x="775" y="622" text-anchor="middle" class="zone-title">调度环境 MissionEnv（固定架构、离线尾部追加排程）</text>

  <rect x="438" y="665" width="305" height="100" rx="10" fill="#ddd7e8" class="node" filter="url(#shadow)"/>
  <text x="591" y="692" text-anchor="middle" class="label">执行 assignment</text>
  <text x="591" y="718" text-anchor="middle" class="small">start = max(system_ready, op_ready)</text>
  <text x="591" y="743" text-anchor="middle" class="small">finish = start + duration</text>
  <path d="M1218 622 C1065 630 919 651 743 710" class="flow-orange"/>

  <rect x="790" y="665" width="320" height="100" rx="10" fill="#d8e2c8" class="node" filter="url(#shadow)"/>
  <text x="950" y="692" text-anchor="middle" class="label">更新排程与派生状态</text>
  <text x="950" y="718" text-anchor="middle" class="small">工序进度、系统可用时刻、Cmax</text>
  <text x="950" y="743" text-anchor="middle" class="small">可行掩码、TTD、slack、25 维 sₜ₊₁</text>
  <path d="M743 715 L790 715" class="flow-green"/>

  <rect x="438" y="806" width="672" height="91" rx="10" fill="#f5dfcb" class="node" filter="url(#shadow)"/>
  <text x="774" y="834" text-anchor="middle" class="label">计算即时奖励</text>
  <text x="774" y="863" text-anchor="middle" class="body">rₜ = −(Cmaxₜ₊₁ − Cmaxₜ) / 总加工时间 M</text>
  <text x="774" y="886" text-anchor="middle" class="small">有效动作继续；无额外 dead-end 惩罚</text>
  <path d="M950 765 C950 790 874 795 874 806" class="flow-orange"/>

  <!-- Termination and output rail -->
  <polygon points="1352,690 1496,764 1352,838 1208,764" fill="#f3d1bb" class="node" filter="url(#shadow)"/>
  <text x="1352" y="748" text-anchor="middle" class="label">终止？</text>
  <text x="1352" y="774" text-anchor="middle" class="small">全部工序完成</text>
  <text x="1352" y="798" text-anchor="middle" class="small">或无可行 assignment</text>
  <path d="M1110 715 C1163 715 1174 739 1208 752" class="flow"/>

  <!-- non-terminal state/replay feedback -->
  <path d="M1208 780 C1148 810 1178 946 1080 946 L570 946 C420 946 386 370 705 347" class="flow"/>
  <text x="1162" y="833" class="small">否：sₜ₊₁</text>
  <path d="M438 851 C374 851 371 546 319 546" class="train-flow"/>
  <text x="352" y="835" class="tiny">transition</text>

  <rect x="1228" y="875" width="248" height="72" rx="10" fill="#e7dfcf" class="node" filter="url(#shadow)"/>
  <text x="1352" y="903" text-anchor="middle" class="label">结束本轮 episode</text>
  <text x="1352" y="930" text-anchor="middle" class="small">成功 / dead end 统计</text>
  <path d="M1352 838 L1352 875" class="flow-orange"/>
  <text x="1366" y="860" class="small">是</text>
  <path d="M1228 913 C1130 913 1140 953 319 829" class="train-flow"/>

  <polygon points="1352,970 1432,1011 1352,1052 1272,1011" fill="#f0d9c3" class="node"/>
  <text x="1352" y="1006" text-anchor="middle" class="small">训练轮次</text>
  <text x="1352" y="1027" text-anchor="middle" class="small">完成？</text>
  <path d="M1352 947 L1352 970" class="flow-orange"/>

  <path d="M1272 1011 C1070 1073 513 1060 513 550" class="flow"/>
  <text x="1110" y="1060" class="small">否：抽取下一场景并重置</text>

  <rect x="1463" y="974" width="116" height="74" rx="12" fill="#cfe2d3" class="node" filter="url(#shadow)"/>
  <text x="1521" y="997" text-anchor="middle" class="small">保存模型</text>
  <text x="1521" y="1019" text-anchor="middle" class="small">贪心评估</text>
  <text x="1521" y="1041" text-anchor="middle" class="small">导出 CSV</text>
  <path d="M1432 1011 L1463 1011" class="flow-green"/>
  <text x="1446" y="998" class="tiny">是</text>

  <ellipse cx="1521" cy="1080" rx="54" ry="18" fill="#f2cfae" class="node"/>
  <text x="1521" y="1085" text-anchor="middle" class="small">结束</text>
  <path d="M1521 1048 L1521 1062" class="flow-green"/>

  <!-- Legend -->
  <line x1="42" y1="1034" x2="82" y2="1034" class="flow"/>
  <text x="92" y="1039" class="tiny">决策 / 状态流</text>
  <line x1="42" y1="1062" x2="82" y2="1062" class="train-flow"/>
  <text x="92" y="1067" class="tiny">训练专用更新</text>
</svg>
